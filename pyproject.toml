[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "j7c_ha"
version = "0.1.0"
description = "Home Assistant custom component for Atorch BLE power meters (J7-C, UC96)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Dallan Wagner" }]
dependencies = [
    "atorch-ble==0.1.1",
]

[project.optional-dependencies]
dev = [
    # Pinned to a known-good triple. pytest-homeassistant-custom-component
    # always pins exactly one homeassistant version; matching it here
    # short-circuits pip's resolver before it can backtrack through old
    # releases that pull pre-PEP-517 sdists (numpy 1.23, aiohttp 3.x).
    "homeassistant==2026.5.2",
    "pytest-homeassistant-custom-component==0.13.331",
    "pytest-cov",
    "ruff",
    "mypy",
    # Transitive deps pulled in by homeassistant.components.bluetooth ->
    # homeassistant.components.usb at import time but not declared as
    # hard requirements of the `homeassistant` PyPI package. Pinned to
    # the versions HA 2026.5.2's component manifests declare.
    "serialx==1.7.3",
    "aiousbwatcher==1.1.2",
    "aioesphomeapi==44.24.1",
]

[project.urls]
Homepage = "https://github.com/dallanwagz/j7c_ha"
Issues = "https://github.com/dallanwagz/j7c_ha/issues"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.mypy]
# strict-typing quality-scale rule. Scoped to the integration package; tests
# are exercised by pytest, not type-checked. Mirrors HA Core's strict profile.
# Targets 3.14 because HA 2026.5.2 uses 3.14-only syntax (the runtime HA
# actually installs on); pyproject's requires-python floor stays >=3.12.
python_version = "3.14"
strict = true
files = ["custom_components/atorch_ble"]
# `custom_components` has no __init__.py, so without explicit package bases
# mypy would name the integration package `atorch_ble` and shadow the
# installed `atorch-ble` library (breaking `from atorch_ble import ...`).
# Anchoring the base at the repo root makes the module `custom_components.
# atorch_ble` — exactly how Home Assistant loads it at runtime.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=custom_components.atorch_ble",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
