[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "j7c_ha"
version = "0.1.0"
description = "Home Assistant custom component for Atorch BLE power meters (J7-C, UC96)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Dallan Wagner" }]
dependencies = [
    "atorch-ble==0.1.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant",
    "pytest-homeassistant-custom-component",
    "pytest-cov",
    "ruff",
    "mypy",
    # Transitive deps pulled in by homeassistant.components.bluetooth ->
    # homeassistant.components.usb at import time but not declared as
    # hard requirements of the `homeassistant` PyPI package.
    "pyserial>=3.5",
    "pyserial-asyncio-fast>=0.11",
    "aioesphomeapi>=24",
    "aiousbwatcher>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/dallanwagz/j7c_ha"
Issues = "https://github.com/dallanwagz/j7c_ha/issues"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=custom_components.atorch_ble",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
