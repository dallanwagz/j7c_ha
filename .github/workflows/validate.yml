name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # HA 2026.5.x requires Python >=3.14.2 (see homeassistant
        # PyPI metadata). Older 3.12/3.13 cannot install the same
        # HA version that pytest-homeassistant-custom-component pins.
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use the legacy editable layout (compat) so HA's custom-component
          # loader, which iterdir()'s every sys.path entry, does not trip
          # on PEP 660's synthetic `__editable__.<dist>.finder.__path_hook__`
          # path entry under Python 3.14.
          pip install -e ".[dev]" --config-settings editable_mode=compat

      - name: Type-check (mypy strict, strict-typing quality-scale rule)
        run: mypy

      - name: Quality-scale checklist guard
        run: python scripts/check_quality_scale_todos.py

      - name: Run pytest with coverage
        run: |
          pytest --cov=custom_components.atorch_ble \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --cov-fail-under=95
